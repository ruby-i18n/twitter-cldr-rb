---
:kk:
  :rbnf:
    :grouping:
    - :type: SpelloutRules
      :ruleset:
      - :type: spellout-numbering-year
        :rules:
        - :value: 0
          :rule: "=%spellout-numbering=;"
      - :type: spellout-numbering
        :rules:
        - :value: 0
          :rule: "=%spellout-cardinal=;"
      - :type: spellout-cardinal
        :rules:
        - :value: "-x"
          :rule: минус >>;
        - :value: x.x
          :rule: "<< бүтін >%%fractions>;"
        - :value: 0
          :rule: нөл;
        - :value: 1
          :rule: бір;
        - :value: 2
          :rule: екі;
        - :value: 3
          :rule: үш;
        - :value: 4
          :rule: төрт;
        - :value: 5
          :rule: бес;
        - :value: 6
          :rule: алты;
        - :value: 7
          :rule: жеті;
        - :value: 8
          :rule: сегіз;
        - :value: 9
          :rule: тоғыз;
        - :value: 10
          :rule: он[ >>];
        - :value: 20
          :rule: жиырма[ >>];
        - :value: 30
          :rule: отыз[ >>];
        - :value: 40
          :rule: қырық[ >>];
        - :value: 50
          :rule: елу[ >>];
        - :value: 60
          :rule: алпыс[ >>];
        - :value: 70
          :rule: жетпіс[ >>];
        - :value: 80
          :rule: сексен[ >>];
        - :value: 90
          :rule: тоқсан[ >>];
        - :value: 100
          :rule: жүз[ >>];
        - :value: 200
          :rule: "<< жүз[ >>];"
        - :value: 1000
          :rule: мың[ >>];
        - :value: 2000
          :rule: "<< мың[ >>];"
        - :value: 1000000
          :rule: миллион[ >>];
        - :value: 2000000
          :rule: "<< миллион[ >>];"
        - :value: 1000000000
          :rule: миллиард[ >>];
        - :value: 2000000000
          :rule: "<< миллиард[ >>];"
        - :value: 1000000000000
          :rule: триллион[ >>];
        - :value: 2000000000000
          :rule: "<< триллион[ >>];"
        - :value: 1000000000000000
          :rule: квадриллион[ >>];
        - :value: 2000000000000000
          :rule: "<< квадриллион[ >>];"
        - :value: 1000000000000000000
          :rule: "=#,##0=;"
      - :type: fractions
        :rules:
        - :value: 10
          :rule: оннан <%spellout-cardinal<;
        - :value: 100
          :rule: жүзден <%spellout-cardinal<;
        - :value: 1000
          :rule: мыңнан <%spellout-cardinal<;
        - :value: 10000
          :rule: он мыңнан <%spellout-cardinal<;
        - :value: 100000
          :rule: жүз мыңнан <%spellout-cardinal<;
        - :value: 1000000
          :rule: миллионнан <%spellout-cardinal<;
        - :value: 10000000
          :rule: он миллионнан <%spellout-cardinal<;
        - :value: 100000000
          :rule: жүз миллионнан <%spellout-cardinal<;
        - :value: 1000000000
          :rule: миллиардтан <%spellout-cardinal<;
        - :value: 10000000000
          :rule: он миллиардтан <%spellout-cardinal<;
        - :value: 100000000000
          :rule: жүз миллиардтан <%spellout-cardinal<;
        - :value: 1000000000000
          :rule: "<0<;"
        :access: private
      - :type: spellout-ordinal
        :rules:
        - :value: "-x"
          :rule: минус >>;
        - :value: x.x
          :rule: "<< бүтін >>;"
        - :value: 0
          :rule: нөлінші;
        - :value: 1
          :rule: бірінші;
        - :value: 2
          :rule: екінші;
        - :value: 3
          :rule: үшінші;
        - :value: 4
          :rule: төртінші;
        - :value: 5
          :rule: бесінші;
        - :value: 6
          :rule: алтыншы;
        - :value: 7
          :rule: жетінші;
        - :value: 8
          :rule: сегізінші;
        - :value: 9
          :rule: тоғызыншы;
        - :value: 10
          :rule: оныншы;
        - :value: 11
          :rule: он>%%ordinal-yeru-suffix>;
        - :value: 20
          :rule: жиырмасыншы;
        - :value: 21
          :rule: жиырма >>;
        - :value: 30
          :rule: отыз>%%ordinal-yeru-suffix>;
        - :value: 40
          :rule: қырық>%%ordinal-yeru-suffix>;
        - :value: 50
          :rule: елу>%%ordinal-i-suffix>;
        - :value: 60
          :rule: алпыс>%%ordinal-yeru-suffix>;
        - :value: 70
          :rule: жетпіс>%%ordinal-i-suffix>;
        - :value: 80
          :rule: сексен>%%ordinal-i-suffix>;
        - :value: 90
          :rule: тоқсан>%%ordinal-yeru-suffix>;
        - :value: 100
          :rule: жүз>%%ordinal-i-suffix>;
        - :value: 200
          :rule: "<%spellout-cardinal< жүз>%%ordinal-i-suffix>;"
        - :value: 1000
          :rule: мың>%%ordinal-yeru-suffix>;
        - :value: 2000
          :rule: "<%spellout-cardinal< мың>%%ordinal-yeru-suffix>;"
        - :value: 1000000
          :rule: миллион>%%ordinal-yeru-suffix>;
        - :value: 2000000
          :rule: "<%spellout-cardinal< миллион>%%ordinal-yeru-suffix>;"
        - :value: 1000000000
          :rule: миллиард>%%ordinal-yeru-suffix>;
        - :value: 2000000000
          :rule: "<%spellout-cardinal< миллиард>%%ordinal-yeru-suffix>;"
        - :value: 1000000000000
          :rule: триллион>%%ordinal-yeru-suffix>;
        - :value: 2000000000000
          :rule: "<%spellout-cardinal< триллион>%%ordinal-yeru-suffix>;"
        - :value: 1000000000000000
          :rule: квадриллион>%%ordinal-yeru-suffix>;
        - :value: 2000000000000000
          :rule: "<%spellout-cardinal< квадриллион>%%ordinal-yeru-suffix>;"
        - :value: 1000000000000000000
          :rule: "=#,##0=;"
      - :type: ordinal-i-suffix
        :rules:
        - :value: 0
          :rule: інші;
        - :value: 1
          :rule: " =%spellout-ordinal=;"
        :access: private
      - :type: ordinal-yeru-suffix
        :rules:
        - :value: 0
          :rule: ыншы;
        - :value: 1
          :rule: " =%spellout-ordinal=;"
        :access: private
    - :type: OrdinalRules
      :ruleset:
      - :type: digits-ordinal
        :rules:
        - :value: "-x"
          :rule: "−>>;"
        - :value: 0
          :rule: "=#,##0=-$(ordinal,many{шы}other{ші})$;"
